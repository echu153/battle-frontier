<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="0.56" stop-color="#edf4fb"/>
      <stop offset="1" stop-color="#d9e6f0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#14283c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1724" flood-opacity="0.22"/>
    </filter>
    <filter id="spriteShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#09121b" flood-opacity="0.35"/>
    </filter>
    <pattern id="fineLines" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0H5" stroke="#1c3144" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0d1b29"/>
  <image href="../taitorugamen.png" x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid slice" opacity="0.22"/>

  <rect x="24" y="24" width="1152" height="627" rx="18" fill="url(#paper)" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="1152" height="627" rx="18" fill="url(#fineLines)"/>
  <rect x="34" y="34" width="1132" height="607" rx="14" fill="none" stroke="#6e8293" stroke-width="3"/>
  <rect x="44" y="44" width="1112" height="587" rx="10" fill="none" stroke="#d8e4ee" stroke-width="2"/>

  <g opacity="0.72" fill="none" stroke="#617789" stroke-width="3" stroke-linecap="round">
    <path d="M430 72h82m176 0h82"/>
    <path d="M518 72l14-10 14 10-14 10zM654 72l14-10 14 10-14 10z"/>
  </g>
  <text x="600" y="82" text-anchor="middle"
        font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="33" font-weight="800" fill="#23384b">
    放置で進む本格バトルRPG
  </text>

  <text x="66" y="190"
        font-family="Impact,'Arial Black','Yu Gothic UI',sans-serif" font-size="102" font-weight="900"
        letter-spacing="3" fill="url(#ink)">
    BATTLE FRONTIER
  </text>
  <rect x="66" y="212" width="760" height="5" rx="2.5" fill="#1f3b55" opacity="0.22"/>

  <text x="70" y="284"
        font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="43" font-weight="900" fill="#104d7a">
    寝ている間も、冒険が進む。
  </text>
  <text x="72" y="329"
        font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="26" font-weight="700" fill="#304a5f">
    育成・装備・ペット・レイドを遊びこめる
  </text>
  <text x="72" y="363"
        font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="26" font-weight="700" fill="#304a5f">
    ブラウザで今すぐ無料プレイ！
  </text>

  <g transform="translate(72 392)">
    <rect x="0" y="0" width="336" height="82" rx="8" fill="#f7fbff" stroke="#9db2c3" stroke-width="4"/>
    <circle cx="48" cy="41" r="21" fill="#1f68a8"/>
    <path d="M53 19a24 24 0 1 0 23 33 27 27 0 1 1-23-33z" fill="#f7fbff"/>
    <text x="92" y="52" font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-size="34" font-weight="900" fill="#25384a">
      放置キャンプ
    </text>
  </g>

  <g filter="url(#spriteShadow)">
    <ellipse cx="780" cy="453" rx="305" ry="54" fill="#9b7a44" opacity="0.22"/>
    <image href="../papia.png" x="465" y="330" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>
    <image href="../koboruto2.png" x="595" y="338" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
    <image href="../sukerutonken.png" x="720" y="333" width="165" height="165" preserveAspectRatio="xMidYMid meet"/>
    <image href="../amaza.png" x="818" y="252" width="250" height="250" preserveAspectRatio="xMidYMid meet"/>
    <image href="../zerugiasu.png" x="928" y="240" width="235" height="235" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g font-family="'Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif" font-weight="800">
    <rect x="0" y="540" width="1200" height="103" fill="#e8f0f7" opacity="0.94"/>
    <line x1="54" y1="540" x2="1146" y2="540" stroke="#a9bac8" stroke-width="2"/>

    <g transform="translate(72 571)">
      <text x="0" y="0" font-size="28" fill="#1f68a8">⚔</text>
      <text x="43" y="1" font-size="23" fill="#31475a">育成と装備を強化</text>
    </g>
    <g transform="translate(350 571)">
      <text x="0" y="0" font-size="28" fill="#1f68a8">Zz</text>
      <text x="53" y="1" font-size="23" fill="#31475a">放置中も経験値蓄積</text>
    </g>
    <g transform="translate(650 571)">
      <text x="0" y="0" font-size="28" fill="#1f68a8">◆</text>
      <text x="42" y="1" font-size="23" fill="#31475a">ペット・レイドも充実</text>
    </g>
    <g transform="translate(947 571)">
      <text x="0" y="0" font-size="28" fill="#1f68a8">▣</text>
      <text x="42" y="1" font-size="23" fill="#31475a">無料で今すぐプレイ</text>
    </g>
  </g>
</svg>

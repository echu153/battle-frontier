<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    position:relative; font-family:'Yu Gothic','Meiryo',sans-serif;
    background:
      radial-gradient(circle at 78% 30%, rgba(255,90,40,0.30), transparent 42%),
      radial-gradient(circle at 20% 80%, rgba(180,20,20,0.28), transparent 45%),
      linear-gradient(135deg,#1a0605 0%,#2a0a08 45%,#100303 100%);
    color:#fff;
  }
  .vignette { position:absolute; inset:0; box-shadow:inset 0 0 220px 60px rgba(0,0,0,0.85); pointer-events:none; }
  .embers { position:absolute; inset:0; background:
      radial-gradient(2px 2px at 15% 25%, rgba(255,180,90,0.6), transparent),
      radial-gradient(2px 2px at 40% 70%, rgba(255,140,60,0.5), transparent),
      radial-gradient(1.5px 1.5px at 65% 20%, rgba(255,200,120,0.5), transparent),
      radial-gradient(2px 2px at 85% 55%, rgba(255,120,50,0.5), transparent),
      radial-gradient(1.5px 1.5px at 55% 88%, rgba(255,170,80,0.5), transparent); }

  .badge { position:absolute; top:52px; left:64px; font-size:20px; font-weight:700; letter-spacing:3px;
    color:#ffcf9a; border:2px solid rgba(255,120,60,0.55); background:rgba(40,10,6,0.6);
    padding:8px 18px; border-radius:22px; }

  .title { position:absolute; top:108px; left:60px; }
  .title .jp { font-size:150px; font-weight:900; line-height:0.92; letter-spacing:6px;
    background:linear-gradient(180deg,#ffe1c0 0%,#ff9a5a 55%,#e0521d 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(255,90,30,0.5); filter:drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }
  .title .en { font-size:30px; font-weight:700; letter-spacing:14px; color:#ffb488; margin-top:2px; margin-left:6px; }

  .sub { position:absolute; top:355px; left:66px; font-size:34px; font-weight:800; color:#fff;
    text-shadow:0 3px 10px rgba(0,0,0,0.8); }
  .tags { position:absolute; top:410px; left:66px; display:flex; gap:12px; }
  .tag { font-size:22px; font-weight:800; color:#ffe0c2; background:rgba(120,30,14,0.55);
    border:1.5px solid rgba(255,120,60,0.55); border-radius:8px; padding:8px 16px; }
  .unlock { position:absolute; top:474px; left:70px; font-size:23px; font-weight:700; color:#ffd08a; }
  .unlock b { color:#ff7a4a; }

  .roster { position:absolute; left:0; right:0; bottom:0; height:150px;
    display:flex; align-items:flex-end; justify-content:center; gap:6px;
    background:linear-gradient(0deg, rgba(0,0,0,0.72), transparent); padding:0 26px 8px; }
  .roster img { height:150px; width:auto; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.7)); }
  .roster img.hero { height:172px; margin:0 2px -6px; filter:drop-shadow(0 0 22px rgba(255,90,40,0.55)); }

  .brand { position:absolute; right:60px; top:56px; text-align:right; }
  .brand .name { font-size:30px; font-weight:900; letter-spacing:2px; color:#f4be5b; }
  .brand .hash { font-size:16px; font-weight:700; color:#e6c6a6; margin-top:4px; }
</style></head>
<body>
  <div class="embers"></div>

  <div class="badge">🔥 新コンテンツ</div>
  <div class="brand">
    <div class="name">BATTLE FRONTIER</div>
    <div class="hash">#ブラウザRPG</div>
  </div>

  <div class="title">
    <div class="jp">八獄</div>
    <div class="en">HACHIGOKU</div>
  </div>

  <div class="sub">八つの地獄の主に、挑め。</div>
  <div class="tags">
    <div class="tag">8地獄 × 5難易度</div>
    <div class="tag">Easy 〜 HELL</div>
  </div>
  <div class="unlock">▶ <b>エリア⑤踏破</b>で開放 ／ 勝てば紋章を鍛える素材を獲得</div>

  <div class="roster">
    <img src="/hatigokuta-pana.png" alt="">
    <img src="/makahadoma.png" alt="">
    <img src="/asipatora.png" alt="">
    <img src="/tibondara.png" alt="">
    <img class="hero" src="/ka-rasu-tora.png" alt="">
    <img src="/pure-ta.png" alt="">
    <img src="/raurava.png" alt="">
    <img src="/zyouhari.png" alt="">
  </div>

  <div class="vignette"></div>
</body></html>

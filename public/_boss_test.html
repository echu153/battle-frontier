<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>boss60 phases</title>
<style>
  body { margin:0; background:#120d08; display:flex; gap:28px; align-items:flex-end; justify-content:center; min-height:100vh; padding:30px 0 60px; }
  .col { text-align:center; }
  .label { color:#cce6ff; font-family:monospace; font-size:15px; margin-top:14px; }
  .sub { color:#8899aa; font-family:monospace; font-size:11px; margin-top:4px; }
  .stage { position:relative; width:300px; height:300px; margin:0 auto; }
  .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  @keyframes b60-bob2 { 0%,49.99% { transform:translateY(0);} 50%,100% { transform:translateY(1.6%);} }
  @keyframes b60-bob3 { 0%,33.32% { transform:translateY(0);} 33.33%,66.65% { transform:translateY(-2.2%);} 66.66%,100% { transform:translateY(-1.1%);} }
  @keyframes b60-diamond {
    0%,24.99% { transform:translateY(0); filter:brightness(1); }
    25%,49.99% { transform:translateY(-1.5%); filter:brightness(1.25) drop-shadow(0 0 6px #66ccffcc); }
    50%,74.99% { transform:translateY(-2.6%); filter:brightness(1.45) drop-shadow(0 0 10px #88ddffee); }
    75%,100% { transform:translateY(-1.3%); filter:brightness(1.2) drop-shadow(0 0 5px #66ccffaa); }
  }
  .body { animation:b60-bob2 2.4s linear infinite; }
  .pendant { animation:b60-bob2 2.4s linear infinite; }
  .droneL { animation:b60-bob3 1.9s linear infinite; }
  .droneR { animation:b60-bob3 1.9s linear infinite -0.95s; }
  .shardsL { animation:b60-bob3 1.9s linear infinite -0.35s; }
  .shardsR { animation:b60-bob3 1.9s linear infinite -1.30s; }
  .diamond { animation:b60-diamond 2.8s linear infinite; }
  .crystalsTop { animation:b60-bob3 2.2s linear infinite -0.7s; }
  .ph0 { }
  .ph1 { filter:brightness(1.18) saturate(1.25) drop-shadow(0 0 8px rgba(120,200,255,0.8)); }
  .ph2 { filter:sepia(0.65) hue-rotate(-28deg) saturate(2.6) brightness(1.08) drop-shadow(0 0 8px rgba(255,80,60,0.9)); }
  .hpbar { width:260px; height:8px; background:#000; border:1px solid #333; margin:10px auto 0; }
  .hpbar div { height:100%; }
</style>
</head>
<body>
  <div class="col">
    <div class="stage ph0">
      <img class="body" src="/boss60/body.png"><img class="pendant" src="/boss60/pendant.png"><img class="droneL" src="/boss60/droneL.png"><img class="droneR" src="/boss60/droneR.png"><img class="shardsL" src="/boss60/shardsL.png"><img class="shardsR" src="/boss60/shardsR.png"><img class="diamond" src="/boss60/diamond.png"><img class="crystalsTop" src="/boss60/crystalsTop.png">
    </div>
    <div class="hpbar"><div style="width:100%;background:#ffd257"></div></div>
    <div class="label" style="color:#ffd257">①装甲形態</div>
    <div class="sub">HP10000／超防御・素の色</div>
  </div>
  <div class="col">
    <div class="stage ph1">
      <img class="body" src="/boss60/body.png"><img class="pendant" src="/boss60/pendant.png"><img class="droneL" src="/boss60/droneL.png"><img class="droneR" src="/boss60/droneR.png"><img class="shardsL" src="/boss60/shardsL.png"><img class="shardsR" src="/boss60/shardsR.png"><img class="diamond" src="/boss60/diamond.png"><img class="crystalsTop" src="/boss60/crystalsTop.png">
    </div>
    <div class="hpbar"><div style="width:100%;background:#66ccff"></div></div>
    <div class="label" style="color:#66ccff">②限界解放</div>
    <div class="sub">HP13000／蒼く発光・ミックス攻撃</div>
  </div>
  <div class="col">
    <div class="stage ph2">
      <img class="body" src="/boss60/body.png"><img class="pendant" src="/boss60/pendant.png"><img class="droneL" src="/boss60/droneL.png"><img class="droneR" src="/boss60/droneR.png"><img class="shardsL" src="/boss60/shardsL.png"><img class="shardsR" src="/boss60/shardsR.png"><img class="diamond" src="/boss60/diamond.png"><img class="crystalsTop" src="/boss60/crystalsTop.png">
    </div>
    <div class="hpbar"><div style="width:100%;background:#ff4455"></div></div>
    <div class="label" style="color:#ff4455">③コア暴走</div>
    <div class="sub">HP9000／赤熱・攻撃特化＋ジャッジメント</div>
  </div>

  <div class="col" style="border-left:1px solid #332a20; padding-left:28px;">
    <div class="stage" id="demo">
      <img class="body" src="/boss60/body.png"><img class="pendant" src="/boss60/pendant.png"><img class="droneL" src="/boss60/droneL.png"><img class="droneR" src="/boss60/droneR.png"><img class="shardsL" src="/boss60/shardsL.png"><img class="shardsR" src="/boss60/shardsR.png"><img class="diamond" src="/boss60/diamond.png"><img class="crystalsTop" src="/boss60/crystalsTop.png">
    </div>
    <div class="hpbar"><div id="demohp" style="width:100%;background:#ffd257;transition:width 0.25s ease"></div></div>
    <div class="label" id="demolabel" style="color:#ffd257">▶ 変形デモ：装甲形態</div>
    <div class="sub">実戦と同じタイミングで自動ループ</div>
  </div>

<style>
  @keyframes demo-blink { 0%,100% { opacity:1; } 50% { opacity:0.15; } }
  .blinking { animation:demo-blink 0.22s steps(1) infinite !important; }
</style>
<script>
  const PH = ['', 'brightness(1.18) saturate(1.25) drop-shadow(0 0 8px rgba(120,200,255,0.8))', 'sepia(0.65) hue-rotate(-28deg) saturate(2.6) brightness(1.08) drop-shadow(0 0 8px rgba(255,80,60,0.9))'];
  const NAMES = ['装甲形態', '限界解放', 'コア暴走'];
  const COLORS = ['#ffd257', '#66ccff', '#ff4455'];
  const demo = document.getElementById('demo');
  const hp = document.getElementById('demohp');
  const label = document.getElementById('demolabel');
  let phase = 0;
  function setPhase(p, blinking) {
    demo.style.filter = PH[p];
    demo.classList.toggle('blinking', blinking);
    label.textContent = (blinking ? '⚡ 形態変化中…' : '▶ 変形デモ：' + NAMES[p]);
    label.style.color = COLORS[p];
    hp.style.background = COLORS[p];
  }
  function drainThen(next) {
    let w = 100;
    const iv = setInterval(() => {
      w -= 5; hp.style.width = Math.max(0, w) + '%';
      if (w <= 0) { clearInterval(iv); next(); }
    }, 130);
  }
  function cycle() {
    setPhase(phase, false);
    hp.style.width = '100%';
    setTimeout(() => drainThen(() => {
      const np = (phase + 1) % 3;
      phase = np;
      setPhase(np, true);
      hp.style.width = '100%';
      setTimeout(() => { setPhase(np, false); cycle(); }, 2000);
    }), 900);
  }
  cycle();
</script>
</body>
</html>
